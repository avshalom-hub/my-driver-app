<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עוזר הניווט לנהג - השלמה אוטומטית</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .suggestions-list {
            position: absolute;
            z-index: 50;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            background: white;
            border: 1px solid #d1d5db;
            border-top: none;
            border-radius: 0 0 0.5rem 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .suggestion-item {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #f3f4f6;
            text-align: right;
        }
        .suggestion-item:hover {
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <header class="bg-blue-600 text-white shadow-md p-4 text-center">
        <h1 class="text-xl font-bold"><i class="fas fa-route ml-2"></i>מנהל מסלולים עם השלמת כתובות</h1>
    </header>

    <main class="flex-1 p-4 max-w-md mx-auto w-full">
        <div class="bg-white p-4 rounded-xl shadow-md mb-4">
            <h2 class="text-md font-semibold mb-3 text-gray-700">הזן כתובות (הראשונה היא המוצא):</h2>
            
            <div id="address-container" class="space-y-4">
                <div class="address-block bg-gray-50 p-3 rounded-lg border border-gray-200 relative">
                    <span class="text-xs font-bold text-green-600 block mb-1">📍 נקודת מוצא (מאיפה מתחילים?)</span>
                    <div class="grid grid-cols-3 gap-2">
                        <input type="text" placeholder="עיר" class="city-in p-2 border rounded bg-white text-sm">
                        <input type="text" placeholder="רחוב" class="street-in p-2 border rounded bg-white text-sm col-span-1">
                        <input type="text" placeholder="מספר" class="num-in p-2 border rounded bg-white text-sm">
                    </div>
                    <input type="hidden" class="full-address">
                    <div class="suggestions-list hidden"></div>
                </div>

                <div class="address-block bg-gray-50 p-3 rounded-lg border border-gray-200 relative">
                    <span class="text-xs font-bold text-blue-600 block mb-1">🛑 עצירה 1</span>
                    <div class="grid grid-cols-3 gap-2">
                        <input type="text" placeholder="עיר" class="city-in p-2 border rounded bg-white text-sm">
                        <input type="text" placeholder="רחוב" class="street-in p-2 border rounded bg-white text-sm col-span-1">
                        <input type="text" placeholder="מספר" class="num-in p-2 border rounded bg-white text-sm">
                    </div>
                    <input type="hidden" class="full-address">
                    <div class="suggestions-list hidden"></div>
                </div>
            </div>
            
            <button onclick="addAddressBlock()" class="mt-4 w-full bg-gray-200 text-gray-700 font-medium py-2 rounded-lg hover:bg-gray-300 transition flex justify-center items-center gap-2">
                <i class="fas fa-plus-circle"></i> הוסף עוד עצירה
            </button>
        </div>

        <button onclick="launchFullRoute()" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-green-700 transition flex flex-col justify-center items-center gap-1 text-lg">
            <span class="flex items-center gap-2"><i class="fas fa-map-marked-alt"></i> פתח מסלול מלא בגוגל מפס</span>
            <span class="text-xs font-normal text-green-100">(כולל זמני נסיעה וסידור תחנות)</span>
        </button>
    </main>

    <script>
        let blockCount = 1;

        // פונקציה להוספת בלוק כתובת חדש (עיר, רחוב, מספר)
        function addAddressBlock() {
            blockCount++;
            const container = document.getElementById('address-container');
            const newBlock = document.createElement('div');
            newBlock.className = 'address-block bg-gray-50 p-3 rounded-lg border border-gray-200 relative';
            newBlock.innerHTML = `
                <span class="text-xs font-bold text-blue-600 block mb-1">🛑 עצירה ${blockCount}</span>
                <div class="grid grid-cols-3 gap-2">
                    <input type="text" placeholder="עיר" class="city-in p-2 border rounded bg-white text-sm">
                    <input type="text" placeholder="רחוב" class="street-in p-2 border rounded bg-white text-sm col-span-1">
                    <input type="text" placeholder="מספר" class="num-in p-2 border rounded bg-white text-sm">
                </div>
                <input type="hidden" class="full-address">
                <div class="suggestions-list hidden"></div>
            `;
            container.appendChild(newBlock);
            setupAutocompleteForBlock(newBlock);
        }

        // הגדרת החיפוש האוטומטי לכל בלוק
        function setupAutocompleteForBlock(block) {
            const cityInput = block.querySelector('.city-in');
            const streetInput = block.querySelector('.street-in');
            const numInput = block.querySelector('.num-in');
            const hiddenInput = block.querySelector('.full-address');
            const suggestionsList = block.querySelector('.suggestions-list');

            let timeout = null;

            // מאזין להקלדה בשדות העיר והרחוב
            [cityInput, streetInput, numInput].forEach(input => {
                input.addEventListener('input', () => {
                    clearTimeout(timeout);
                    
                    // נחכה רבע שנייה אחרי שהמשתמש מפסיק להקליד כדי לא להעמיס
                    timeout = setTimeout(async () => {
                        const city = cityInput.value.trim();
                        const street = streetInput.value.trim();
                        const num = numInput.value.trim();
                        
                        // עדכון הכתובת המשולבת כברירת מחדל
                        hiddenInput.value = `${street} ${num} ${city}`.trim();

                        if (city.length < 2 && street.length < 2) {
                            suggestionsList.classList.add('hidden');
                            return;
                        }

                        // בניית שאילתת חיפוש
                        const searchQuery = `${street} ${num} ${city} ישראל`.trim();
                        
                        try {
                            const response = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(searchQuery)}&lang=txt&limit=5`);
                            const data = await response.json();
                            
                            if (data.features && data.features.length > 0) {
                                suggestionsList.innerHTML = '';
                                suggestionsList.classList.remove('hidden');

                                data.features.forEach(feature => {
                                    const p = feature.properties;
                                    // סינון ובניית הכתובת בעברית בצורה יפה
                                    let formatted = "";
                                    if (p.street) formatted += p.street + " ";
                                    if (p.housenumber) formatted += p.housenumber + ", ";
                                    if (p.city) formatted += p.city;
                                    else if (p.name && !p.street) formatted += p.name;
                                    
                                    if(formatted.trim() === "") return;

                                    const item = document.createElement('div');
                                    item.className = 'suggestion-item';
                                    item.innerText = formatted;
                                    
                                    // בלחיצה על הצעה מהרשימה
                                    item.addEventListener('click', () => {
                                        cityInput.value = p.city || p.name || "";
                                        streetInput.value = p.street || "";
                                        numInput.value = p.housenumber || "";
                                        hiddenInput.value = formatted; // שמירת הכתובת המלאה והתקנית
                                        suggestionsList.classList.add('hidden');
                                    });

                                    suggestionsList.appendChild(item);
                                });
                            } else {
                                suggestionsList.classList.add('hidden');
                            }
                        } catch (e) {
                            console.error("שגיאה בטעינת הכתובות", e);
                        }
                    }, 300);
                });
            });

            // סגירת הרשימה אם לוחצים מחוץ לבלוק
            document.addEventListener('click', (e) => {
                if (!block.contains(e.target)) {
                    suggestionsList.classList.add('hidden');
                }
            });
        }

        // הפעלת האוטוקומפליט על הבלוקים הקיימים בהתחלה
        document.querySelectorAll('.address-block').forEach(block => setupAutocompleteForBlock(block));

        function launchFullRoute() {
            const hiddens = document.querySelectorAll('.full-address');
            let addresses = [];
            
            hiddens.forEach(input => {
                if(input.value.trim() !== "") {
                    addresses.push(input.value.trim());
                }
            });

            if (addresses.length < 2) {
                alert("אנא הזן לפחות 2 כתובות כדי לבנות מסלול");
                return;
            }

            const origin = encodeURIComponent(addresses[0]);
            const destination = encodeURIComponent(addresses[addresses.length - 1]);
            
            let waypoints = [];
            if (addresses.length > 2) {
                for (let i = 1; i < addresses.length - 1; i++) {
                    waypoints.push(encodeURIComponent(addresses[i]));
                }
            }

            let googleMapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}`;
            if (waypoints.length > 0) {
                googleMapsUrl += `&waypoints=${waypoints.join('|')}`;
            }

            window.open(googleMapsUrl, '_blank');
        }
    </script>
</body>
</html>
