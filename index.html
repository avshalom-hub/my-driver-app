<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>עוזר הניווט לנהג - מסלול מלא</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans min-h-screen flex flex-col">

    <header class="bg-blue-600 text-white shadow-md p-4 text-center">
        <h1 class="text-xl font-bold"><i class="fas fa-route ml-2"></i>מנהל מסלולים רב-תחנות</h1>
    </header>

    <main class="flex-1 p-4 max-w-md mx-auto w-full">
        <div class="bg-white p-4 rounded-xl shadow-md mb-4">
            <h2 class="text-md font-semibold mb-3 text-gray-700">הזן את כל הכתובות של היום:</h2>
            <div id="address-container" class="space-y-2">
                <input type="text" placeholder="נקודת מוצא (מאיפה מתחילים?)" class="address-input w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" placeholder="עצירה 1" class="address-input w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="text" placeholder="עצירה 2" class="address-input w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            
            <button onclick="addAddressField()" class="mt-3 w-full bg-gray-200 text-gray-700 font-medium py-2 rounded-lg hover:bg-gray-300 transition flex justify-center items-center gap-2">
                <i class="fas fa-plus-circle"></i> הוסף עוד עצירה
            </button>
        </div>

        <button onclick="launchFullRoute()" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-green-700 transition flex flex-col justify-center items-center gap-1 text-lg">
            <span class="flex items-center gap-2"><i class="fas fa-map-marked-alt"></i> פתח מסלול מלא בגוגל מפס</span>
            <span class="text-xs font-normal text-green-100">(כולל זמני נסיעה וסידור תחנות עם האצבע)</span>
        </button>

        <div class="mt-6 bg-yellow-50 border-r-4 border-yellow-500 p-4 rounded-lg text-sm text-gray-700 shadow-sm">
            <p class="font-bold mb-1"><i class="fas fa-info-circle ml-1"></i> איך זה עובד?</p>
            <p>בלחיצה על הכפתור, כל התחנות ייפתחו יחד בתוך אפליקציית המפות. שם תוכל לראות את זמני הנסיעה הכוללים, ולגרור את התחנות כדי לשנות את הסדר לפי מה שהכי מהיר לך!</p>
        </div>
    </main>

    <script>
        function addAddressField() {
            const container = document.getElementById('address-container');
            const inputCount = container.getElementsByTagName('input').length;
            const newInput = document.createElement('input');
            newInput.type = 'text';
            newInput.placeholder = `עצירה ${inputCount - 1}`;
            newInput.className = 'address-input w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500';
            container.appendChild(newInput);
        }

        function launchFullRoute() {
            const inputs = document.querySelectorAll('.address-input');
            let addresses = [];
            
            inputs.forEach(input => {
                if(input.value.trim() !== "") {
                    addresses.push(input.value.trim());
                }
            });

            if (addresses.length < 2) {
                alert("אנא הזן לפחות 2 כתובות כדי לבנות מסלול");
                return;
            }

            const origin = encodeURIComponent(addresses[0]);
            const destination = encodeURIComponent(addresses[addresses.length - 1]);
            
            // איסוף כל התחנות שבאמצע (עצירות ביניים)
            let waypoints = [];
            if (addresses.length > 2) {
                for (let i = 1; i < addresses.length - 1; i++) {
                    waypoints.push(encodeURIComponent(addresses[i]));
                }
            }

            // בניית קישור עמוק מיוחד לגוגל מפס שמכיל את כל העצירות בבת אחת
            let googleMapsUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}`;
            
            if (waypoints.length > 0) {
                googleMapsUrl += `&waypoints=${waypoints.join('|')}`;
            }

            // פתיחת המסלול המלא ישירות באפליקציה בטלפון
            window.open(googleMapsUrl, '_blank');
        }
    </script>
</body>
</html>
